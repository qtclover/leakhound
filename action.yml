name: leakhound
description: Scan a repository and its git history for leaked secrets
branding:
  icon: shield
  color: red

inputs:
  version:
    description: Release of leakhound to run, such as v0.3.0, or "latest"
    default: latest
  path:
    description: Directory to scan
    default: .
  args:
    description: Extra arguments, for example "--history --format sarif"
    default: --history

runs:
  using: composite
  steps:
    - shell: bash
      # Inputs go through the environment rather than being pasted into the
      # script, so a value containing shell syntax cannot run as code.
      env:
        LEAKHOUND_VERSION: ${{ inputs.version }}
        LEAKHOUND_PATH: ${{ inputs.path }}
        LEAKHOUND_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)   name=leakhound-x86_64-linux;   ext=tar.gz; exe=leakhound ;;
          macOS-ARM64) name=leakhound-aarch64-macos;  ext=tar.gz; exe=leakhound ;;
          macOS-X64)   name=leakhound-x86_64-macos;   ext=tar.gz; exe=leakhound ;;
          Windows-X64) name=leakhound-x86_64-windows; ext=zip;    exe=leakhound.exe ;;
          *)
            echo "::error::leakhound has no binary for $RUNNER_OS $RUNNER_ARCH"
            exit 2
            ;;
        esac
        if [ "$LEAKHOUND_VERSION" = "latest" ]; then
          base="https://github.com/qtclover/leakhound/releases/latest/download"
        else
          base="https://github.com/qtclover/leakhound/releases/download/$LEAKHOUND_VERSION"
        fi
        dir="$RUNNER_TEMP/leakhound"
        mkdir -p "$dir"
        curl -fsSL "$base/$name.$ext" -o "$dir/$name.$ext"
        curl -fsSL "$base/SHA256SUMS" -o "$dir/SHA256SUMS"
        (
          cd "$dir"
          grep " $name.$ext\$" SHA256SUMS > expected
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c expected
          else
            shasum -a 256 -c expected
          fi
          if [ "$ext" = "zip" ]; then
            unzip -q "$name.$ext" || 7z x "$name.$ext"
          else
            tar -xzf "$name.$ext"
          fi
        )
        # shellcheck disable=SC2086  # args are meant to split into words
        "$dir/$name/$exe" "$LEAKHOUND_PATH" $LEAKHOUND_ARGS
