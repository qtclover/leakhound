[package]
name = "leakhound"
version = "0.2.0"
edition = "2024"
description = "Fast secret scanner for source trees and git history"
license = "MIT"
repository = "https://github.com/qtclover/leakhound"
homepage = "https://github.com/qtclover/leakhound"
readme = "README.md"
keywords = ["secrets", "security", "scanner", "git", "credentials"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.88"
exclude = [".github/", "action.yml", "bench/", "assets/"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.21"
ignore = "0.4.34"
memchr = "2.8.3"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
toml = "1.2.1"
ureq = "2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
