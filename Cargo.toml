[package]
name = "leakhound"
version = "0.1.0"
edition = "2024"
description = "Fast secret scanner for source trees and git history"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.34"
memchr = "2.8.3"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
