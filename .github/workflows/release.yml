name: Release

# Pushing a tag like v0.2.0 builds a static Linux binary and publishes it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install the musl C toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "$GITHUB_REF_NAME"
      - run: cargo test --locked
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Package
        run: |
          name="leakhound-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir "$name"
          cp target/x86_64-unknown-linux-musl/release/leakhound README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "leakhound $GITHUB_REF_NAME" \
            --generate-notes \
            leakhound-*.tar.gz SHA256SUMS
